<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TripSplits | Trip Money Manager</title>
    <meta name="description" content="TripSplits helps groups split trip expenses, track balances, and settle payments clearly." />
    <meta name="theme-color" content="#2563eb" />
    <meta property="og:title" content="TripSplits | Trip Money Manager" />
    <meta property="og:description" content="Split trip expenses without confusion. Add friends, track spending, and settle fast." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./public/tripsplits-logo.png" />
    <link rel="preload" href="./styles.min.css" as="style" />
    <link rel="preload" href="./app.js" as="script" />
    <style>
      :root{--bg:#f7f9fc;--surface:#fff;--ink:#101828;--muted:#667085;--line:#e4e7ec;--blue:#2563eb}
      *{box-sizing:border-box}
      body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:0}
      .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem clamp(1rem,3vw,2.5rem);background:rgba(248,251,255,.98);border-bottom:1px solid rgba(191,219,254,.74);will-change:transform}
      .page{width:min(1200px,calc(100% - 2rem));margin:0 auto;padding:clamp(1rem,3vw,2.5rem) 0 4rem}
      .brand,.nav,.hero-actions,.actions-row,.inline-actions{display:flex;align-items:center}
      .nav{gap:.35rem;overflow-x:auto;padding-bottom:.1rem}
    </style>
    <link rel="stylesheet" href="./styles.min.css" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="./styles.min.css" /></noscript>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
